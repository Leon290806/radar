name: Trend-Test

# Nur Statistik (Backtest Trend-Baustein) ins Protokoll – kein Journal, kein Dashboard.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bericht:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Zwischenspeicher lesen
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: radar-${{ github.run_id }}
          restore-keys: radar-
      - name: Trend-Bericht
        run: python trend.py
