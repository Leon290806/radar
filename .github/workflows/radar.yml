name: Radar

on:
  schedule:
    - cron: "25 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: cache
          key: radar-${{ github.run_id }}
          restore-keys: radar-

      - name: Radar ausführen
        env:
          CI: "1"
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NTFY_THEMA: ${{ secrets.NTFY_THEMA }}
          RADAR_PASSWORT: ${{ secrets.RADAR_PASSWORT }}
          KAPITAL_EUR: ${{ vars.KAPITAL_EUR }}
          ZEIGE_EURO: ${{ vars.ZEIGE_EURO || '1' }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python radar.py --kein-browser

      - name: Journal speichern
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add speicher/journal.enc docs/index.html
          git diff --cached --quiet || git commit -m "Radar $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
